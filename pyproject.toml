[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airunner-tts-vendor"
version = "0.1.0"
description = "Vendored MeloTTS and OpenVoice forks used by AI Runner's TTS pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Capsize LLC" }]
dependencies = [
    # Lightweight text/audio-format handling only. torch/torchaudio/
    # transformers are a separate "ml" extra (see below), matching
    # Capsize-Games/airunner's own established pattern
    # (services/setup.py's ML_RUNTIME_REQUIREMENTS): a CUDA-pinned
    # torch build can't be a hard base dependency, since installing
    # it needs an explicit --index-url the base install shouldn't
    # force on every consumer (docs/architecture/
    # versioning-and-compatibility-policy.md, issue #2191).
    "numpy==2.2.5",
    "librosa==0.11.0",
    "pydub==0.25.1",
    "wavmark==0.0.3",
    "eng_to_ipa==0.0.2",
    "inflect==7.5.0",
    "unidecode==1.4.0",
    "langid==1.1.6",
    "txtsplit==1.0.0",
    "num2words==0.5.14",
    "g2p_en==2.1.0",
    "anyascii==0.3.2",
    "loguru==0.7.3",
]

[project.optional-dependencies]
# torch/torchaudio/transformers, matching the pins
# Capsize-Games/airunner's services/setup.py already established for
# this exact code. Install with an explicit index for your platform,
# e.g.:
#   pip install "airunner-tts-vendor[ml]" \
#     --index-url https://download.pytorch.org/whl/cu129   # GPU
#   pip install "airunner-tts-vendor[ml]" \
#     --index-url https://download.pytorch.org/whl/cpu     # CPU
ml = [
    "torch==2.13.0+cu129",
    "torchaudio==2.11.0+cu129",
    "transformers==5.8.1",
]
# Per-language OpenVoice/MeloTTS support, matching the source
# repository's extras split (services/setup.py).
zh = ["pypinyin==0.54.0", "jieba==0.42.1", "cn2an==0.5.23"]
jp = [
    "unidic_lite==1.0.8",
    "unidic==1.1.0",
    "mecab-python3==1.0.10",
    "fugashi==1.4.0",
    "pykakasi==2.3.0",
]
kr = [
    "jamo==0.4.1",
    "python-mecab-ko==1.3.7",
    "python-mecab-ko-dic==2.1.1.post2",
]
tw = ["g2pkk>=0.1.2"]
gruut = ["gruut[de,es,fr]==2.4.0", "networkx==3.4.2"]
dev = ["pytest", "pytest-timeout"]

[tool.setuptools.packages.find]
include = ["airunner_tts_vendor*"]

[tool.setuptools.package-data]
airunner_tts_vendor = [
    "melo/LICENSE",
    "melo/README.md",
    "melo/configs/*.json",
    "melo/data/example/*.list",
    "melo/text/cmudict.rep",
    "melo/text/opencpop-strict.txt",
    "melo/text/es_phonemizer/*.json",
    "melo/text/es_phonemizer/*.txt",
    "melo/text/fr_phonemizer/*.json",
    "melo/text/fr_phonemizer/*.txt",
    "openvoice/LICENSE",
    "openvoice/README.md",
]
