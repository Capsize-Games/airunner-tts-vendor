name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # The base install has no explicit torch dependency of its own
      # (torch is a separate "ml" extra pinned to a CUDA build --
      # see pyproject.toml), but g2p_en pulls in a CPU torch build
      # transitively, which is enough to exercise melo/api.py and
      # openvoice/api.py's imports. test_torch_dependent_modules.py
      # still guards with importorskip("torch") rather than assuming
      # that stays true.
      - run: pytest tests -v
